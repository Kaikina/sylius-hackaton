sylius_twig_hooks:
    hooks:
        'sylius_shop.base.header.content':
            wishlist:
                component: 'evolutive_wishlist:counter'
                priority: 150

        'sylius_shop.shared.product.card':
            wishlist:
                component: 'evolutive_wishlist:card_toggle'
                props:
                    product: '@=_context.product'
                priority: 200

        'sylius_shop.product.show.content.info.summary':
            wishlist:
                component: 'evolutive_wishlist:product_toggle'
                props:
                    product: '@=_context.product'
                priority: 50
